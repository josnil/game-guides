<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地图事件控制台 · 暗渊崛起攻略站</title>
<!--
  ============================================================
  地图事件控制台（本地工具，不参与站点构建）
  ------------------------------------------------------------
  用途：可视化地增删地点页的事件打点、给打点加浮窗文字。

  打开方式：直接双击本文件（file:// 下也能正常工作）。
  数据来源：同目录的 map-console-data.js（由 tools/build-maps.py 生成）

  为什么不用 fetch 读 JSON：
    本地 file:// 页面里 fetch/XHR 会被浏览器拦掉，
    而普通的 script 标签不受此限制，所以数据写成了 .js。

  工作流：
    1. 双击打开本页 → 选地图 → 增删打点 / 加浮窗
    2. 点「下载 map_overrides.yml」
    3. 用它替换仓库里的 game-guides/_data/map_overrides.yml
    4. 运行 python tools/build-maps.py 重新生成
    5. 发布：npm run publish -- -m "调整地图打点"
  ============================================================
-->
<style>
  /* ---------- 设计令牌：与攻略站同一套配色，工具也不该是另一个东西 ---------- */
  :root {
    --ink-950: #0b1219;
    --ink-900: #101a24;
    --ink-800: #1a2632;
    --ink-700: #26374a;
    --gold-500: #d4a04a;
    --gold-400: #e2b667;
    --gold-200: #f2dcae;
    --paper-100: #f7f4ed;
    --paper-200: #efe9dd;
    --paper-300: #e2dacb;
    --on-ink: #f2ece0;
    --on-ink-dim: #b9b1a3;
    --on-ink-faint: #7d8b99;
    --text-dark: #2b2722;
    --text-head: #1f1b16;
    --text-muted: #6b6156;
    --teal: #1c6a63;
    --danger: #a33a2f;

    --font-display: "KaiTi", "STKaiti", "Kaiti SC", "Songti SC", serif;
    --font-sans: "Source Han Sans SC", "Noto Sans SC", "HarmonyOS Sans SC", "PingFang SC",
      "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
    --font-num: "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);

    --bar-h: 3.5rem;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    background-color: var(--ink-900);
    color: var(--on-ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
  }

  /* ---------- 顶栏 ---------- */
  .bar {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex: 0 0 auto;
    height: var(--bar-h);
    padding: 0 1rem;
    background-color: var(--ink-950);
    border-bottom: 1px solid var(--ink-700);
  }

  .bar__title {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    margin: 0;
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .bar__sub {
    color: var(--on-ink-faint);
    font-family: var(--font-num);
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .bar__spacer { flex: 1 1 auto; }

  /* 第一眼记忆点：网格线 + 金色辉光的图标，像一张摊开的战术地图 */
  .bar__mark {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 7px;
    border: 1px solid rgba(212, 160, 74, 0.5);
    background:
      linear-gradient(90deg, transparent 46%, rgba(212, 160, 74, 0.45) 46%, rgba(212, 160, 74, 0.45) 54%, transparent 54%),
      linear-gradient(0deg, transparent 46%, rgba(212, 160, 74, 0.45) 46%, rgba(212, 160, 74, 0.45) 54%, transparent 54%),
      radial-gradient(circle at 30% 25%, rgba(212, 160, 74, 0.35), transparent 70%);
  }

  /* ---------- 模式切换 ---------- */
  .modes {
    display: flex;
    gap: 0.25rem;
    padding: 0.2rem;
    border: 1px solid var(--ink-700);
    border-radius: 10px;
    background-color: rgba(0, 0, 0, 0.22);
  }

  .mode {
    min-height: 34px;
    padding: 0.3rem 0.8rem;
    border: 1px solid transparent;
    border-radius: 7px;
    background: none;
    color: var(--on-ink-dim);
    font-family: inherit;
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.16s ease, background-color 0.16s ease, border-color 0.16s ease;
  }

  .mode:hover { color: var(--on-ink); background-color: var(--ink-800); }

  .mode:focus-visible { outline: 2px solid var(--gold-400); outline-offset: 1px; }

  .mode[aria-pressed="true"] {
    color: var(--ink-950);
    border-color: var(--gold-500);
    background-image: linear-gradient(180deg, var(--gold-200), var(--gold-500));
  }

  /* ---------- 三栏主体 ---------- */
  .wrap {
    display: grid;
    grid-template-columns: 15rem minmax(0, 1fr) 20rem;
    flex: 1 1 auto;
    min-height: 0;
  }

  .pane {
    min-height: 0;
    overflow-y: auto;
    scrollbar-color: var(--ink-700) transparent;
  }

  .pane--list { background-color: var(--ink-900); border-right: 1px solid var(--ink-700); }
  .pane--canvas { background-color: var(--paper-100); color: var(--text-dark); padding: 1.1rem; }
  .pane--side { background-color: var(--ink-900); border-left: 1px solid var(--ink-700); padding: 1rem; }

  .pane::-webkit-scrollbar { width: 9px; }
  .pane::-webkit-scrollbar-thumb { background-color: var(--ink-700); border-radius: 5px; }

  /* ---------- 左：地图列表 ---------- */
  .list__title {
    margin: 1rem 0 0.4rem;
    padding: 0 0.9rem;
    color: var(--on-ink);
    font-family: var(--font-display);
    font-size: 1rem;
    letter-spacing: 0.05em;
  }

  .mapitem {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    width: 100%;
    min-height: 44px;
    padding: 0.4rem 0.9rem;
    border: 0;
    border-left: 3px solid transparent;
    background: none;
    color: var(--on-ink-dim);
    font-family: inherit;
    font-size: 0.9rem;
    text-align: left;
    cursor: pointer;
    transition: color 0.16s ease, background-color 0.16s ease, border-color 0.16s ease, padding-left 0.2s var(--ease);
  }

  .mapitem:hover {
    color: var(--on-ink);
    background-color: var(--ink-800);
    border-left-color: var(--gold-500);
    padding-left: 1.05rem;
  }

  .mapitem:focus-visible { outline: 2px solid var(--gold-400); outline-offset: -2px; }

  .mapitem[aria-current="true"] {
    color: var(--on-ink);
    background-color: var(--ink-800);
    border-left-color: var(--gold-500);
    font-weight: 600;
  }

  .mapitem__name { flex: 1 1 auto; }

  .mapitem__n {
    flex: 0 0 auto;
    padding: 0 0.4rem;
    border-radius: 999px;
    background-color: rgba(212, 160, 74, 0.14);
    color: var(--gold-400);
    font-family: var(--font-num);
    font-size: 0.72rem;
  }

  .mapitem__dot {
    flex: 0 0 auto;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(28, 106, 99, 0.28);
  }

  /* ---------- 中：画布 ---------- */
  .canvas__head {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    margin-bottom: 0.7rem;
  }

  .canvas__title {
    margin: 0;
    color: var(--text-head);
    font-family: var(--font-display);
    font-size: 1.35rem;
  }

  .canvas__meta {
    color: var(--text-muted);
    font-size: 0.8rem;
  }

  .stage {
    position: relative;
    border: 1px solid var(--paper-300);
    border-radius: 12px;
    background-color: var(--paper-200);
    box-shadow: 0 1px 2px rgba(31, 27, 22, 0.06), 0 14px 30px -20px rgba(31, 27, 22, 0.5);
    /* 占位：图片未加载时也保持比例，避免布局跳动 */
    aspect-ratio: var(--ar, 1);
  }

  .stage img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 11px;
    image-rendering: auto;
  }

  /* 网格参考线：新增模式下才显示，帮助对准格子 */
  .grid {
    position: absolute;
    inset: 0;
    border-radius: 11px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
    background-image:
      repeating-linear-gradient(90deg, rgba(28, 106, 99, 0.28) 0 1px, transparent 1px var(--cellw, 48px)),
      repeating-linear-gradient(0deg, rgba(28, 106, 99, 0.28) 0 1px, transparent 1px var(--cellh, 48px));
  }

  body[data-mode="add"] .grid { opacity: 1; }

  /* ---------- 标记 ---------- */
  .mk {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    padding: 0;
    transform: translate(-50%, -50%);
    border: 0;
    border-radius: 50%;
    background: none;
    cursor: pointer;
    z-index: 2;
  }

  .mk:focus-visible { outline: 2px solid var(--gold-500); outline-offset: 1px; }

  .mk__dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid #fffdf8;
    background: radial-gradient(circle at 35% 30%, var(--gold-200), var(--gold-500) 70%);
    box-shadow: 0 0 0 1px rgba(31, 27, 22, 0.5);
    transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }

  .mk:hover .mk__dot {
    transform: scale(1.35);
    box-shadow: 0 0 0 1px rgba(31, 27, 22, 0.55), 0 0 0 8px rgba(212, 160, 74, 0.22);
  }

  /* 新增的点：青色，一眼区分 */
  .mk--added .mk__dot {
    background: radial-gradient(circle at 35% 30%, #8fd8d1, var(--teal) 70%);
  }

  /* 待删除的点：灰掉并打叉 */
  .mk--removed .mk__dot {
    background: radial-gradient(circle at 35% 30%, #c9c3b8, #8b8578 70%);
    opacity: 0.75;
  }

  .mk--removed::after {
    content: "";
    position: absolute;
    width: 17px;
    height: 2px;
    border-radius: 2px;
    background-color: var(--danger);
    transform: rotate(-45deg);
  }

  /* 有浮窗的点：外圈加一圈金色，提示它带了文字 */
  .mk--labeled .mk__dot {
    box-shadow: 0 0 0 1px rgba(31, 27, 22, 0.5), 0 0 0 5px rgba(212, 160, 74, 0.4);
  }

  /* 选中（标注模式）：呼吸提示 */
  .mk[aria-pressed="true"] .mk__dot {
    box-shadow: 0 0 0 1px rgba(31, 27, 22, 0.55), 0 0 0 9px rgba(28, 106, 99, 0.35);
  }

  /* 浮窗预览：浏览模式下悬停就显示最终效果 */
  .mk__tip {
    position: absolute;
    bottom: calc(100% - 2px);
    left: 50%;
    padding: 0.25rem 0.55rem;
    transform: translate(-50%, 3px);
    border: 1px solid rgba(212, 160, 74, 0.55);
    border-radius: 8px;
    background-color: rgba(13, 20, 28, 0.94);
    color: var(--on-ink);
    font-size: 0.79rem;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s ease, transform 0.2s var(--ease);
  }

  body[data-mode="view"] .mk:hover .mk__tip,
  body[data-mode="view"] .mk:focus-visible .mk__tip,
  body[data-mode="label"] .mk[aria-pressed="true"] .mk__tip {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .newdot {
    position: absolute;
    width: 13px;
    height: 13px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px solid #fffdf8;
    background: radial-gradient(circle at 35% 30%, #8fd8d1, var(--teal) 70%);
    pointer-events: none;
    opacity: 0;
  }

  /* ---------- 右：面板 ---------- */
  .card {
    margin-bottom: 0.9rem;
    padding: 0.85rem 0.95rem;
    border: 1px solid var(--ink-700);
    border-radius: 10px;
    background-color: rgba(0, 0, 0, 0.18);
  }

  .card__title {
    margin: 0 0 0.45rem;
    color: var(--on-ink);
    font-family: var(--font-display);
    font-size: 0.98rem;
    letter-spacing: 0.04em;
  }

  .hint {
    margin: 0;
    color: var(--on-ink-dim);
    font-size: 0.84rem;
    line-height: 1.65;
  }

  .hint b { color: var(--gold-400); }

  .stats {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.25rem 0.6rem;
    font-size: 0.86rem;
    color: var(--on-ink-dim);
  }

  .stats b {
    color: var(--on-ink);
    font-family: var(--font-num);
    font-size: 1rem;
  }

  .stats .d-rem { color: #e8a99f; }
  .stats .d-add { color: #8fd8d1; }
  .stats .d-lbl { color: var(--gold-400); }

  .field { margin-top: 0.6rem; }

  .field label {
    display: block;
    margin-bottom: 0.25rem;
    color: var(--on-ink-dim);
    font-size: 0.78rem;
  }

  input[type="text"], textarea {
    width: 100%;
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--ink-700);
    border-radius: 8px;
    background-color: var(--ink-800);
    color: var(--on-ink);
    font-family: inherit;
    font-size: 0.86rem;
  }

  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--gold-500);
  }

  input[type="text"]::placeholder { color: var(--on-ink-faint); }

  textarea {
    min-height: 11rem;
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 0.76rem;
    line-height: 1.6;
    resize: vertical;
  }

  .btns { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.7rem; }

  .btn {
    flex: 1 1 auto;
    min-height: 40px;
    padding: 0.4rem 0.7rem;
    border: 1px solid var(--ink-700);
    border-radius: 8px;
    background-color: var(--ink-800);
    color: var(--on-ink);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.16s ease, background-color 0.16s ease, transform 0.16s var(--ease);
  }

  .btn:hover { border-color: var(--gold-500); background-color: var(--ink-700); transform: translateY(-1px); }
  .btn:focus-visible { outline: 2px solid var(--gold-400); outline-offset: 1px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .btn--primary {
    border-color: var(--gold-500);
    background-image: linear-gradient(180deg, var(--gold-200), var(--gold-500));
    color: var(--ink-950);
  }

  .btn--primary:hover { background-image: linear-gradient(180deg, #fff0d0, var(--gold-400)); }

  .btn--danger:hover { border-color: var(--danger); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 1.5rem;
    padding: 0.6rem 1.1rem;
    transform: translate(-50%, 1rem);
    border: 1px solid rgba(212, 160, 74, 0.5);
    border-radius: 999px;
    background-color: rgba(13, 20, 28, 0.96);
    color: var(--on-ink);
    font-size: 0.86rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.26s var(--ease);
    z-index: 50;
  }

  .toast.is-on { opacity: 1; transform: translate(-50%, 0); }

  .empty {
    margin: 2rem 0;
    padding: 1.2rem;
    border: 1px dashed var(--paper-300);
    border-radius: 12px;
    color: var(--text-muted);
    text-align: center;
  }

  /* ---------- 窄屏：面板收到下面，仍然可用 ---------- */
  @media (max-width: 1080px) {
    .wrap { grid-template-columns: 12rem minmax(0, 1fr); }
    .pane--side {
      grid-column: 1 / -1;
      max-height: 26rem;
      border-left: 0;
      border-top: 1px solid var(--ink-700);
    }
  }

  @media (max-width: 720px) {
    .wrap { grid-template-columns: minmax(0, 1fr); }
    .pane--list { max-height: 13rem; border-right: 0; border-bottom: 1px solid var(--ink-700); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
    .mk:hover .mk__dot { transform: none; }
    .mapitem:hover { padding-left: 0.9rem; }
    .btn:hover { transform: none; }
  }
</style>
</head>
<body data-mode="view">

<header class="bar">
  <span class="bar__mark" aria-hidden="true"></span>
  <h1 class="bar__title">地图事件控制台<span class="bar__sub">Map Console</span></h1>

  <div class="bar__spacer"></div>

  <div class="modes" role="group" aria-label="操作模式">
    <button class="mode" type="button" data-mode="view" aria-pressed="true">浏览</button>
    <button class="mode" type="button" data-mode="remove" aria-pressed="false">删除</button>
    <button class="mode" type="button" data-mode="add" aria-pressed="false">新增</button>
    <button class="mode" type="button" data-mode="label" aria-pressed="false">加浮窗</button>
  </div>
</header>

<div class="wrap">
  <!-- 左：地图列表 -->
  <aside class="pane pane--list" aria-label="地点列表">
    <h2 class="list__title">地点</h2>
    <div id="maplist"></div>
  </aside>

  <!-- 中：画布 -->
  <main class="pane pane--canvas">
    <div class="canvas__head">
      <h2 class="canvas__title" id="mtitle">请选择左侧地点</h2>
      <span class="canvas__meta" id="mmeta"></span>
    </div>
    <div id="canvasHost">
      <div class="empty">左侧点一个地点，地图会显示在这里。</div>
    </div>
  </main>

  <!-- 右：操作与导出 -->
  <aside class="pane pane--side" aria-label="操作面板">
    <div class="card">
      <h2 class="card__title">当前模式</h2>
      <p class="hint" id="modeHint"></p>
    </div>

    <div class="card">
      <h2 class="card__title">本次改动</h2>
      <div class="stats">
        <span>删除打点</span><b class="d-rem" id="nRemove">0</b>
        <span>新增打点</span><b class="d-add" id="nAdd">0</b>
        <span>浮窗文字</span><b class="d-lbl" id="nLabel">0</b>
      </div>
      <div class="field">
        <label for="labelInput" id="labelFor">浮窗文字（在「加浮窗」模式下先点一个打点）</label>
        <input type="text" id="labelInput" placeholder="例如：隐藏宝箱 / 商店入口" disabled>
      </div>
      <div class="btns">
        <button class="btn" type="button" id="btnClearLabel">清除该浮窗</button>
        <button class="btn btn--danger" type="button" id="btnReset">全部还原</button>
      </div>
    </div>

    <div class="card">
      <h2 class="card__title">导出</h2>
      <p class="hint">
        1. 点下面的按钮下载 <b>map_overrides.yml</b><br>
        2. 用它替换 <b>game-guides/_data/map_overrides.yml</b><br>
        3. 运行 <b>python tools/build-maps.py</b> 重新生成
      </p>
      <div class="btns">
        <button class="btn btn--primary" type="button" id="btnDownload">下载 map_overrides.yml</button>
        <button class="btn" type="button" id="btnCopy">复制内容</button>
      </div>
      <div class="field">
        <label for="yamlOut">也可以直接复制这里的内容</label>
        <textarea id="yamlOut" spellcheck="false" readonly></textarea>
      </div>
    </div>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="map-console-data.js"></script>
<script>
(function () {
  "use strict";

  var DATA = window.WB_MAP_DATA || { maps: {}, events: {} };
  var MAPS = DATA.maps;
  var IDS = Object.keys(MAPS).sort(function (a, b) { return Number(a) - Number(b); });

  var STORE_KEY = "wb-map-console-v1";

  // ---------- 状态 ----------
  // 用「图块坐标」的字符串 "tx,ty" 作为键，可读、也便于导出
  var state = {
    cur: null,
    remove: {},   // mapId -> { "tx,ty": true }
    add: {},      // mapId -> { "tx,ty": true }
    label: {}     // mapId -> { "tx,ty": "文字" }
  };
  var selected = null; // 当前选中的打点键（加浮窗模式用）

  function key(tx, ty) { return tx + "," + ty; }
  function mapBucket(bag, id) {
    if (!bag[id]) bag[id] = {};
    return bag[id];
  }
  function bucketSize(bag, id) { return bag[id] ? Object.keys(bag[id]).length : 0; }

  // ---------- 从上次的改动里恢复（刷新不丢） ----------
  function loadSaved() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (s && typeof s === "object") {
        state.remove = s.remove || {};
        state.add = s.add || {};
        state.label = s.label || {};
      }
    } catch (e) { /* 存坏了就当作没有，不影响使用 */ }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- 用生成器已应用的覆盖初始化 ----------
  // 这样打开控制台时看到的就是当前线上状态，可以接着改，而不是从零开始。
  function seedFromData() {
    Object.keys(MAPS).forEach(function (id) {
      var ov = MAPS[id].overrides;
      if (!ov) return;
      (ov.remove || []).forEach(function (p) { mapBucket(state.remove, id)[key(p[0], p[1])] = true; });
      (ov.add || []).forEach(function (p) { mapBucket(state.add, id)[key(p[0], p[1])] = true; });
      Object.keys(ov.label || {}).forEach(function (k) { mapBucket(state.label, id)[k] = ov.label[k]; });
    });
  }

  // ---------- 计算某张图最终要显示的打点 ----------
  function markersFor(id) {
    var meta = MAPS[id];
    var out = [];
    var seen = {};

    // 1) 游戏原始的每个打点
    (meta.original || []).forEach(function (p) {
      var k = key(p[0], p[1]);
      seen[k] = true;
      var removed = !!(state.remove[id] && state.remove[id][k]);
      out.push({ k: k, tx: p[0], ty: p[1], kind: removed ? "removed" : "base" });
    });

    // 2) 手动新增的（若坐标与原始点重合，就当作「不再删除」处理）
    Object.keys(state.add[id] || {}).forEach(function (k) {
      if (seen[k]) return;
      var p = k.split(",");
      out.push({ k: k, tx: Number(p[0]), ty: Number(p[1]), kind: "added" });
    });

    // 3) 挂上浮窗文字
    out.forEach(function (m) {
      var t = state.label[id] && state.label[id][m.k];
      if (t) m.label = t;
    });

    // 4) 仅统计真正会显示的点
    out.forEach(function (m) { m.shown = m.kind !== "removed"; });
    return out;
  }

  function shownCount(id) {
    return markersFor(id).filter(function (m) { return m.shown; }).length;
  }

  // ---------- 左侧列表 ----------
  function renderList() {
    var host = document.getElementById("maplist");
    host.textContent = "";
    IDS.forEach(function (id) {
      var meta = MAPS[id];
      var b = document.createElement("button");
      b.type = "button";
      b.className = "mapitem";
      b.setAttribute("aria-current", String(state.cur === id));

      var n = document.createElement("span");
      n.className = "mapitem__name";
      n.textContent = meta.title;

      var c = document.createElement("span");
      c.className = "mapitem__n";
      c.textContent = shownCount(id);

      // 有未导出改动的，给个青点提示
      var dirty = bucketSize(state.remove, id) || bucketSize(state.add, id) || bucketSize(state.label, id);
      b.appendChild(n);
      b.appendChild(c);
      if (dirty) {
        var d = document.createElement("span");
        d.className = "mapitem__dot";
        d.title = "有改动";
        d.setAttribute("aria-label", "有改动");
        b.appendChild(d);
      }

      b.addEventListener("click", function () { selectMap(id); });
      host.appendChild(b);
    });
  }

  // ---------- 画布 ----------
  function selectMap(id) {
    state.cur = id;
    selected = null;
    syncLabelInput();
    renderList();
    renderCanvas();
  }

  function renderCanvas() {
    var host = document.getElementById("canvasHost");
    var id = state.cur;
    host.textContent = "";
    if (!id) return;

    var meta = MAPS[id];
    var title = document.getElementById("mtitle");
    var mmeta = document.getElementById("mmeta");
    title.textContent = meta.title;
    mmeta.textContent = meta.w + " × " + meta.h + " 格";

    var stage = document.createElement("div");
    stage.className = "stage";
    // 图片未加载时也按地图比例占位，避免加载完布局跳动（CLS）
    stage.style.setProperty("--ar", (meta.w / meta.h).toFixed(4));
    // 网格线间距 = 一格占的百分比
    stage.style.setProperty("--cellw", (100 / meta.w).toFixed(4) + "%");
    stage.style.setProperty("--cellh", (100 / meta.h).toFixed(4) + "%");

    var img = document.createElement("img");
    // 数据里存的是站点根路径（/assets/maps/42.png），控制台在 tools/ 下，所以要回退一级
    img.src = meta.image ? ".." + meta.image : "";
    img.alt = meta.title + " 地图";
    img.addEventListener("load", function () {
      stage.style.aspectRatio = "auto";
    });
    stage.appendChild(img);

    var grid = document.createElement("div");
    grid.className = "grid";
    stage.appendChild(grid);

    // 标记
    markersFor(id).forEach(function (m) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "mk" + (m.kind === "added" ? " mk--added" : "") +
        (m.kind === "removed" ? " mk--removed" : "") +
        (m.label ? " mk--labeled" : "");
      btn.style.left = ((m.tx + 0.5) / meta.w * 100).toFixed(4) + "%";
      btn.style.top = ((m.ty + 0.5) / meta.h * 100).toFixed(4) + "%";
      btn.setAttribute("aria-pressed", String(selected === m.k));
      btn.setAttribute("aria-label",
        meta.title + " " + m.tx + "," + m.ty + (m.label ? "：" + m.label : "") +
        (m.kind === "removed" ? "（已标记删除）" : ""));

      var dot = document.createElement("span");
      dot.className = "mk__dot";
      btn.appendChild(dot);

      // 浮窗预览：没写文字时也给出坐标，方便对照
      var tip = document.createElement("span");
      tip.className = "mk__tip";
      tip.textContent = m.label || (m.tx + "," + m.ty);
      btn.appendChild(tip);

      btn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        onMarkerClick(m);
      });
      stage.appendChild(btn);
    });

    // 新增模式：点空白格子
    var ghost = document.createElement("span");
    ghost.className = "newdot";
    stage.appendChild(ghost);

    stage.addEventListener("mousemove", function (ev) {
      if (document.body.dataset.mode !== "add") return;
      var t = tileFromEvent(ev, stage, meta);
      ghost.style.left = ((t.tx + 0.5) / meta.w * 100).toFixed(4) + "%";
      ghost.style.top = ((t.ty + 0.5) / meta.h * 100).toFixed(4) + "%";
      ghost.style.opacity = "0.75";
    });
    stage.addEventListener("mouseleave", function () { ghost.style.opacity = "0"; });

    stage.addEventListener("click", function (ev) {
      if (document.body.dataset.mode !== "add") return;
      var t = tileFromEvent(ev, stage, meta);
      addMarker(t.tx, t.ty);
    });

    host.appendChild(stage);
  }

  function tileFromEvent(ev, stage, meta) {
    var r = stage.getBoundingClientRect();
    var px = (ev.clientX - r.left) / r.width;
    var py = (ev.clientY - r.top) / r.height;
    var tx = Math.min(meta.w - 1, Math.max(0, Math.floor(px * meta.w)));
    var ty = Math.min(meta.h - 1, Math.max(0, Math.floor(py * meta.h)));
    return { tx: tx, ty: ty };
  }

  // ---------- 交互 ----------
  function onMarkerClick(m) {
    var id = state.cur;
    var mode = document.body.dataset.mode;

    if (mode === "remove") {
      var isBase = (MAPS[id].original || []).some(function (p) {
        return p[0] === m.tx && p[1] === m.ty;
      });
      if (isBase) {
        // 原始点：切换「删除」标记
        var bucket = mapBucket(state.remove, id);
        if (bucket[m.k]) delete bucket[m.k];
        else bucket[m.k] = true;
        delete mapBucket(state.add, id)[m.k];
      } else {
        // 自己新增的点：直接移除，不留删除标记（本来就不该存在）
        delete mapBucket(state.add, id)[m.k];
        delete mapBucket(state.remove, id)[m.k];
      }
      afterChange("已" + (state.remove[id] && state.remove[id][m.k] ? "标记删除" : "恢复") + " " + m.tx + "," + m.ty);
    } else if (mode === "label") {
      selected = m.k;
      syncLabelInput();
      renderCanvas();
      var inp = document.getElementById("labelInput");
      if (inp) inp.focus();
    } else if (mode === "view") {
      toast(m.label ? m.tx + "," + m.ty + "：" + m.label : "这个点没有浮窗（切到「加浮窗」模式可以加）");
    } else {
      toast("当前是「新增」模式：点空白格子加点，点已有点不会改动");
    }
  }

  function addMarker(tx, ty) {
    var id = state.cur;
    var k = key(tx, ty);
    var isBase = (MAPS[id].original || []).some(function (p) { return p[0] === tx && p[1] === ty; });
    if (isBase) {
      // 点在原始点上：相当于「取消删除」
      if (state.remove[id] && state.remove[id][k]) {
        delete state.remove[id][k];
        afterChange("已恢复 " + k);
      } else {
        toast(k + " 已经有点了");
      }
      return;
    }
    if (state.add[id] && state.add[id][k]) {
      toast(k + " 已经加过了");
      return;
    }
    mapBucket(state.add, id)[k] = true;
    afterChange("已新增 " + k);
  }

  function afterChange(msg) {
    save();
    syncStats();
    renderCanvas();
    renderList();
    if (msg) toast(msg);
  }

  // ---------- 浮窗文字输入 ----------
  function syncLabelInput() {
    var inp = document.getElementById("labelInput");
    var lab = document.getElementById("labelFor");
    if (!state.cur || !selected) {
      inp.disabled = true;
      inp.value = "";
      lab.textContent = "浮窗文字（在「加浮窗」模式下先点一个打点）";
      return;
    }
    inp.disabled = false;
    lab.textContent = "浮窗文字 · 打点 " + selected;
    inp.value = (state.label[state.cur] && state.label[state.cur][selected]) || "";
  }

  // ---------- 统计 ----------
  function syncStats() {
    var r = 0, a = 0, l = 0;
    IDS.forEach(function (id) {
      r += bucketSize(state.remove, id);
      a += bucketSize(state.add, id);
      l += bucketSize(state.label, id);
    });
    document.getElementById("nRemove").textContent = r;
    document.getElementById("nAdd").textContent = a;
    document.getElementById("nLabel").textContent = l;
  }

  // ---------- 导出 YAML ----------
  function buildYaml() {
    var lines = [];
    lines.push("# 由「地图事件控制台」导出。");
    lines.push("# 生成时间：" + new Date().toLocaleString("zh-CN"));
    lines.push("# 用法：替换 game-guides/_data/map_overrides.yml，");
    lines.push("#       然后运行 python tools/build-maps.py");
    lines.push("");

    var any = false;
    IDS.forEach(function (id) {
      var rk = Object.keys(state.remove[id] || {}).sort();
      var ak = Object.keys(state.add[id] || {}).sort();
      var lk = Object.keys(state.label[id] || {}).sort();
      if (!rk.length && !ak.length && !lk.length) return;
      any = true;

      lines.push('"' + id + '":   # ' + MAPS[id].title);
      if (rk.length) {
        lines.push("  remove:");
        rk.forEach(function (k) { lines.push('    - "' + k + '"'); });
      }
      if (ak.length) {
        lines.push("  add:");
        ak.forEach(function (k) { lines.push('    - "' + k + '"'); });
      }
      if (lk.length) {
        lines.push("  label:");
        lk.forEach(function (k) { lines.push('    "' + k + '": ' + state.label[id][k]); });
      }
      lines.push("");
    });

    if (!any) {
      lines.push("# 当前没有任何改动。");
      lines.push("# 想加内容的话，在「删除 / 新增 / 加浮窗」模式下操作后再导出。");
    }
    return lines.join("\n") + "\n";
  }

  function syncYaml() {
    document.getElementById("yamlOut").value = buildYaml();
  }

  // ---------- 提示条 ----------
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("is-on");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("is-on"); }, 2200);
  }

  // ---------- 模式说明 ----------
  var HINTS = {
    view: "只浏览。把鼠标移到打点上，可以看到它在站点上会显示的浮窗效果。",
    remove: "点一个<b>金色</b>打点 = 标记删除（变灰打叉）；再点一次 = 恢复。<br>点了就会变灰，方便你反复比较。",
    add: "在<b>空白格子上点一下</b>就新增一个打点（自动吸附到格子）。<br>点已有打点不会新增，但如果是被标记删除的，会顺手恢复它。",
    label: "先点一个打点，再在下面输入文字，回车保存。<br>有浮窗的打点外圈会多一圈金色。"
  };

  function setMode(mode) {
    document.body.dataset.mode = mode;
    Array.prototype.forEach.call(document.querySelectorAll(".mode"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
    });
    document.getElementById("modeHint").innerHTML = HINTS[mode] || "";
    if (mode !== "label") selected = null;
    syncLabelInput();
    renderCanvas();
  }

  // ---------- 启动 ----------
  loadSaved();
  if (!Object.keys(state.remove).length && !Object.keys(state.add).length && !Object.keys(state.label).length) {
    seedFromData();
  }

  if (!IDS.length) {
    document.getElementById("canvasHost").innerHTML =
      '<div class="empty">读不到地图数据。<br><br>请先运行 <b>python tools/build-maps.py</b> 生成 ' +
      '<b>tools/map-console-data.js</b>，然后刷新本页。</div>';
  } else {
    renderList();
    selectMap(IDS[0]);
  }

  Array.prototype.forEach.call(document.querySelectorAll(".mode"), function (b) {
    b.addEventListener("click", function () { setMode(b.dataset.mode); });
  });

  document.getElementById("labelInput").addEventListener("input", function (ev) {
    if (!state.cur || !selected) return;
    var v = ev.target.value.trim();
    var bucket = mapBucket(state.label, state.cur);
    if (v) bucket[selected] = v;
    else delete bucket[selected];
    save();
    syncStats();
    syncYaml();
    renderCanvas();
    renderList();
  });

  document.getElementById("btnClearLabel").addEventListener("click", function () {
    if (!state.cur || !selected) { toast("先切到「加浮窗」模式，点一个打点"); return; }
    var bucket = mapBucket(state.label, state.cur);
    if (!bucket[selected]) { toast("这个打点本来就没有浮窗"); return; }
    delete bucket[selected];
    afterChange("已清除 " + selected + " 的浮窗");
    syncYaml();
  });

  document.getElementById("btnReset").addEventListener("click", function () {
    if (!confirm("把所有改动清空，回到「与游戏数据一致 + 已应用的覆盖」的状态？")) return;
    state.remove = {}; state.add = {}; state.label = {};
    selected = null;
    seedFromData();
    save();
    syncStats();
    syncYaml();
    syncLabelInput();
    renderCanvas();
    renderList();
    toast("已还原");
  });

  document.getElementById("btnDownload").addEventListener("click", function () {
    var text = buildYaml();
    var blob = new Blob([text], { type: "text/yaml;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "map_overrides.yml";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast("已下载，替换到 game-guides/_data/ 即可");
  });

  document.getElementById("btnCopy").addEventListener("click", function () {
    var text = buildYaml();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { toast("已复制到剪贴板"); },
        function () { document.getElementById("yamlOut").select(); toast("复制失败，已全选，请按 Ctrl+C"); }
      );
    } else {
      var ta = document.getElementById("yamlOut");
      ta.removeAttribute("readonly");
      ta.select();
      document.execCommand("copy");
      ta.setAttribute("readonly", "readonly");
      toast("已复制");
    }
  });

  setMode("view");
  syncStats();
  syncYaml();

  // 快捷键：1/2/3/4 切模式（输入框里打字时不拦）
  document.addEventListener("keydown", function (ev) {
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    var map = { "1": "view", "2": "remove", "3": "add", "4": "label" };
    if (map[ev.key]) { setMode(map[ev.key]); ev.preventDefault(); }
  });
})();
</script>
</body>
</html>
