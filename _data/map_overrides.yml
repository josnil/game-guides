# ============================================================
# 地图打点的手动增删 + 浮窗文字
# ------------------------------------------------------------
# ⭐ 通常你不需要手写这个文件：
#    双击打开 tools/map-console.html，用可视化控制台点点点，
#    再点「下载 map_overrides.yml」覆盖本文件即可。
#    控制台里还能直接预览悬停浮窗的实际效果。
#
# 这个文件的作用：让你在不改游戏数据的前提下调整打点，
# 而且**重新运行 tools/build-maps.py 也不会被冲掉**。
#
# ── 格式 ──────────────────────────────────────────────────
# 坐标用「图块坐标」，即 x,y 两个整数，和游戏地图编辑器里事件所在的格子一致。
#
#   "地图id":
#     remove:           # 要去掉的打点
#       - "19,28"
#     add:              # 要补上的打点
#       - "5,5"
#     label:            # 给打点加悬停浮窗（key 是坐标，值是文字）
#       "34,18": 商城入口
#
# 地图 id 就是网址里那个数字（/map/42/ → 42）。
# 坐标从哪看？每个地点页最下方有「打点坐标对照表」，
# 或者在控制台里直接用鼠标点。
#
# 写错了不会静默忽略：脚本会指出行号并中止，其他文件不会被改动。
# ============================================================

# 下面是示例（已注释掉，删掉行首的 # 即可生效）：
#
# "42":
#   remove:
#     - "19,28"
#   add:
#     - "5,5"
#   label:
#     "34,18": 商城入口
#
# "27":
#   remove:
#     - "12,25"     # 比如：这是「返回世界大地图」的传送点，不想标出来
#   label:
#     "5,14": 杂货铺
