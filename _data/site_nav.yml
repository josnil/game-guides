# 顶部导航栏
# ------------------------------------------------------------
# 想增删菜单项，改这里就行，不用动模板。
# 每个条目：
#   title  显示文字
#   url    链接地址（相对站点根，会自动补上 baseurl）
#   desc   悬停时显示的小字说明（尽量控制在 5~6 个字，太长会把顶栏挤满）
#
# 这份列表同时决定**侧边栏显示哪个内容索引**：
# 当前页面落在哪一项的网址下，侧边栏就渲染那一项对应的索引。
# 网址前缀 → 分区 → 索引的对应关系写在
# _includes/components/site_nav.html 的顶部注释里。
# ------------------------------------------------------------

