# ============================================================
# 游戏版本库 —— 全站「攻略是否过期」的唯一真源
# ------------------------------------------------------------
# 游戏更新时，通常你只需要改上面这两行：
#   current   当前版本号
#   supported 仍然有效的版本号列表
#
# 任何一篇攻略，只要它的 game_version 不在 supported 列表里，
# 就会被自动判定为「可能已过期」：
#   - 攻略页顶部的版本徽章自动变红
#   - /outdated/ 页面自动把它列进待复核清单
# 不需要逐篇去改文章。
# ============================================================

current: "2.4"

# 仍被判定为有效的版本。删掉某个版本号，全站的过期状态就会立刻重算。
supported: ["2.4", "2.3", "2.2"]

# 版本历史，用于展示版本名与发布时间
history:
  - id: "2.4"
    name: "2.4 版本"
    released: 2026-06-01
    status: current
  - id: "2.3"
    name: "2.3 版本"
    released: 2026-02-10
    status: supported
  - id: "2.2"
    name: "2.2 版本"
    released: 2025-10-05
    status: supported
  - id: "2.1"
    name: "2.1 版本"
    released: 2025-08-01
    status: outdated
