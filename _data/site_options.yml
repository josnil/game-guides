# ============================================================
# 界面开关
# ------------------------------------------------------------
# 改完直接 push 即可生效，不需要重新生成地图数据。
# 删掉某个键 = 用下面的默认值。
# ============================================================

world_map:
  # 世界大地图：鼠标悬停在地点标记上时，是否浮现地名浮窗
  tooltip: true

place_map:
  # 地点页：是否在图上标出事件位置（关掉就是一张干净的地图）
  markers: true
  # 地点页：打点上是否再显示浮窗
  #   默认关 —— 需求是「只标注位置、不展示事件内容」。
  #   打开后浮窗里只显示图块坐标，方便你对照着写 map_overrides.yml。
  tooltip: false
